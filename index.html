<!doctype html>
<html lang="it">
<head>

  I file dei capitoli vengono caricati solo quando si parte.
-->

<!-- versione: "classe" (LIM) oppure "casa" (pacchetto per gli studenti) -->
<script src="modalita.js"></script>
<script src="casa-impostazioni.js"></script>

<script src="motore/lingue.js"></script>

<script src="lingue/fr.js"></script>
<script src="lingue/ar.js"></script>
<script src="lingue/es.js"></script>

<!-- impostazioni della scuola: le classi create al primo avvio -->
<script src="scuola.js"></script>

<!-- la stazione (menu) -->
<script src="stazione/grafica.js"></script>
<script src="stazione/testi.js"></script>
